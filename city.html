<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="《大逃杀都市》是一款融合七日生存、人物社交与案件推理的俯视角单机游戏。">
  <title>大逃杀都市｜张长瑞的作品集</title>
  <link rel="icon" href="assets/site-logo.png">
  <link rel="stylesheet" href="css/city.css">
</head>
<body>
  <main class="city-stage">
    <section class="city-slide city-art-slide" id="slide-1" aria-labelledby="slide-title-1">
      <h1 class="visually-hidden" id="slide-title-1" tabindex="-1">大逃杀都市</h1>
      <figure class="city-board" data-slide="1">
        <img class="city-base" fetchpriority="high" src="assets/city/page-06.jpg" width="1700" height="957" alt="大逃杀都市，原作品集第 6 页">
      </figure>
    </section>
    <section class="city-slide city-art-slide" id="slide-2" aria-labelledby="slide-title-2" hidden>
      <h2 class="visually-hidden" id="slide-title-2" tabindex="-1">谁在说谎？</h2>
      <figure class="city-board" data-slide="2">
        <img class="city-base" loading="lazy" src="assets/city/2-plate.webp" width="1700" height="957" alt="谁在说谎？，原作品集第 7 页">
          <img class="city-layer" data-layer="trail" src="assets/city/2-trail.webp" alt="" decoding="async" style="--float-delay:0s">
          <img class="city-layer" data-layer="sight" src="assets/city/2-sight.webp" alt="" decoding="async" style="--float-delay:-1.25s">
          <img class="city-layer" data-layer="trace" src="assets/city/2-trace.webp" alt="" decoding="async" style="--float-delay:-2.5s">
          <button type="button" class="city-hotspot" data-rule="brief" aria-haspopup="dialog"><span>设计命题</span></button>
          <button type="button" class="city-hotspot" data-rule="trail" data-floats="trail" aria-haspopup="dialog"><span>人物行踪</span></button>
          <button type="button" class="city-hotspot" data-rule="sight" data-floats="sight" aria-haspopup="dialog"><span>目击范围</span></button>
          <button type="button" class="city-hotspot" data-rule="trace" data-floats="trace" aria-haspopup="dialog"><span>物证轨迹</span></button>
      </figure>
    </section>
    <section class="city-slide city-art-slide" id="slide-3" aria-labelledby="slide-title-3" hidden>
      <h2 class="visually-hidden" id="slide-title-3" tabindex="-1">七个昼夜</h2>
      <figure class="city-board" data-slide="3">
        <img class="city-base" loading="lazy" src="assets/city/3-plate.webp" width="1700" height="957" alt="七个昼夜，原作品集第 8 页">
          <img class="city-layer" data-layer="day" src="assets/city/3-day.webp" alt="" decoding="async" style="--float-delay:0s">
          <img class="city-layer" data-layer="night" src="assets/city/3-night.webp" alt="" decoding="async" style="--float-delay:-1.25s">
          <img class="city-layer" data-layer="dawn" src="assets/city/3-dawn.webp" alt="" decoding="async" style="--float-delay:-2.5s">
          <button type="button" class="city-hotspot" data-rule="loop" aria-haspopup="dialog"><span>七个昼夜</span></button>
          <button type="button" class="city-hotspot" data-rule="day" data-floats="day" aria-haspopup="dialog"><span>白天 / 经营与结识</span></button>
          <button type="button" class="city-hotspot" data-rule="night" data-floats="night" aria-haspopup="dialog"><span>夜晚 / 匿名与风险</span></button>
          <button type="button" class="city-hotspot" data-rule="dawn" data-floats="dawn" aria-haspopup="dialog"><span>次日 / 线索与指证</span></button>
      </figure>
    </section>
    <section class="city-slide city-art-slide" id="slide-4" aria-labelledby="slide-title-4" hidden>
      <h2 class="visually-hidden" id="slide-title-4" tabindex="-1">AI 只提出下一步</h2>
      <figure class="city-board" data-slide="4">
        <img class="city-base" loading="lazy" src="assets/city/4-plate.webp" width="1700" height="957" alt="AI 只提出下一步，原作品集第 9 页">
          <img class="city-layer" data-layer="agent" src="assets/city/4-agent.webp" alt="" decoding="async" style="--float-delay:0s">
          <button type="button" class="city-hotspot" data-rule="input" aria-haspopup="dialog"><span>AI 行动输入</span></button>
          <button type="button" class="city-hotspot" data-rule="trigger" aria-haspopup="dialog"><span>重新决策的触发条件</span></button>
          <button type="button" class="city-hotspot" data-rule="proposal" aria-haspopup="dialog"><span>行动提案与规则校验</span></button>
          <button type="button" class="city-hotspot" data-rule="agent" data-floats="agent" aria-haspopup="dialog"><span>智能体观察面板</span></button>
      </figure>
    </section>
    <section class="city-slide city-art-slide" id="slide-5" aria-labelledby="slide-title-5" hidden>
      <h2 class="visually-hidden" id="slide-title-5" tabindex="-1">城市如何自主运转</h2>
      <figure class="city-board" data-slide="5">
        <img class="city-base" loading="lazy" src="assets/city/5-plate.webp" width="1700" height="957" alt="城市如何自主运转，原作品集第 10 页">
          <img class="city-layer" data-layer="engine" src="assets/city/5-engine.webp" alt="" decoding="async" style="--float-delay:0s">
          <button type="button" class="city-hotspot" data-rule="schedule" aria-haspopup="dialog"><span>白天与夜晚的行动</span></button>
          <button type="button" class="city-hotspot" data-rule="engine" data-floats="engine" aria-haspopup="dialog"><span>本地决策与城市地图</span></button>
          <button type="button" class="city-hotspot" data-rule="engine" aria-haspopup="dialog"><span>本地决策与城市地图</span></button>
          <button type="button" class="city-hotspot" data-rule="schedule" aria-haspopup="dialog"><span>白天与夜晚的行动</span></button>
      </figure>
    </section>
    <section class="city-slide city-art-slide" id="slide-6" aria-labelledby="slide-title-6" hidden>
      <h2 class="visually-hidden" id="slide-title-6" tabindex="-1">一宗案件，多种证据</h2>
      <figure class="city-board" data-slide="6">
        <img class="city-base" loading="lazy" src="assets/city/6-plate.webp" width="1700" height="957" alt="一宗案件，多种证据，原作品集第 11 页">
          <img class="city-layer" data-layer="record" src="assets/city/6-record.webp" alt="" decoding="async" style="--float-delay:0s">
          <button type="button" class="city-hotspot" data-rule="record" data-floats="record" aria-haspopup="dialog"><span>个人情报与案件记录</span></button>
          <button type="button" class="city-hotspot" data-rule="autopsy" aria-haspopup="dialog"><span>法医 / 武器与死亡时间</span></button>
          <button type="button" class="city-hotspot" data-rule="witness" aria-haspopup="dialog"><span>目击 / 只报告所见所闻</span></button>
          <button type="button" class="city-hotspot" data-rule="alibi" aria-haspopup="dialog"><span>行踪 / 接近现场或身在异地</span></button>
          <button type="button" class="city-hotspot" data-rule="verify" aria-haspopup="dialog"><span>核验 / 物证怎样改变判断</span></button>
      </figure>
    </section>
    <section class="city-slide city-art-slide" id="slide-7" aria-labelledby="slide-title-7" hidden>
      <h2 class="visually-hidden" id="slide-title-7" tabindex="-1">推理与日终裁决</h2>
      <figure class="city-board" data-slide="7">
        <img class="city-base" loading="lazy" src="assets/city/7-plate.webp" width="1700" height="957" alt="推理与日终裁决，原作品集第 12 页">
          <img class="city-layer" data-layer="suspectA" src="assets/city/7-suspectA.webp" alt="" decoding="async" style="--float-delay:0s">
          <img class="city-layer" data-layer="suspectB" src="assets/city/7-suspectB.webp" alt="" decoding="async" style="--float-delay:-1.25s">
          <img class="city-layer" data-layer="suspectC" src="assets/city/7-suspectC.webp" alt="" decoding="async" style="--float-delay:-2.5s">
          <button type="button" class="city-hotspot" data-rule="verdict" aria-haspopup="dialog"><span>推理与日终裁决</span></button>
          <button type="button" class="city-hotspot" data-rule="verify" data-floats="suspectA" aria-haspopup="dialog"><span>核验 / 物证怎样改变判断</span></button>
          <button type="button" class="city-hotspot" data-rule="witness" data-floats="suspectB" aria-haspopup="dialog"><span>目击 / 只报告所见所闻</span></button>
          <button type="button" class="city-hotspot" data-rule="alibi" data-floats="suspectC" aria-haspopup="dialog"><span>行踪 / 接近现场或身在异地</span></button>
          <button type="button" class="city-hotspot" data-rule="verify" aria-haspopup="dialog"><span>核验 / 物证怎样改变判断</span></button>
      </figure>
    </section>
    <section class="city-slide city-art-slide" id="slide-8" aria-labelledby="slide-title-8" hidden>
      <h2 class="visually-hidden" id="slide-title-8" tabindex="-1">一座城市，多种真相</h2>
      <figure class="city-board" data-slide="8">
        <img class="city-base" loading="lazy" src="assets/city/page-13.jpg" width="1700" height="957" alt="一座城市，多种真相，原作品集第 13 页">
          <button type="button" class="city-hotspot" data-rule="action" aria-haspopup="dialog"><span>行动先于叙事</span></button>
          <button type="button" class="city-hotspot" data-rule="knowledge" aria-haspopup="dialog"><span>认知受限于感知</span></button>
          <button type="button" class="city-hotspot" data-rule="conclusion" aria-haspopup="dialog"><span>结论来自验证</span></button>
      </figure>
    </section>
    <section class="city-slide city-video" id="gameplay" aria-labelledby="gameplay-title" hidden>
      <h2 id="gameplay-title" tabindex="-1">实机演示</h2>
      <video controls playsinline preload="none" width="1920" height="1200" poster="assets/city/poster.webp" aria-label="大逃杀都市实机演示" data-playlist="assets/video-streams/city/index.m3u8">需要浏览器支持 HTML 视频。</video>
      <p data-video-status role="status" hidden></p>
    </section>
    <canvas id="city-particles" aria-hidden="true"></canvas>
  </main>
  <header class="city-header">
    <a id="city-back" href="index.html?page=2">← 返回作品地图</a>
    <a href="#gameplay">实机演示</a>
  </header>
  <footer class="city-controls" aria-label="翻页">
    <button id="city-previous" type="button">← 上一页</button>
    <div class="city-pages">
      <select id="city-page" aria-label="选择展板">
        <option value="slide-1">1 / 大逃杀都市</option>
        <option value="slide-2">2 / 谁在说谎？</option>
        <option value="slide-3">3 / 七个昼夜</option>
        <option value="slide-4">4 / AI 只提出下一步</option>
        <option value="slide-5">5 / 城市如何自主运转</option>
        <option value="slide-6">6 / 一宗案件，多种证据</option>
        <option value="slide-7">7 / 推理与日终裁决</option>
        <option value="slide-8">8 / 一座城市，多种真相</option>
        <option value="gameplay">9 / 实机演示</option>
      </select>
      <output id="city-position" aria-live="polite">1 / 9</output>
    </div>
    <button id="city-next" type="button">下一页 →</button>
  </footer>
  <dialog id="city-rule" aria-labelledby="city-rule-title">
    <div class="city-rule-header">
      <h2 id="city-rule-title"></h2>
      <form method="dialog"><button aria-label="关闭规则">×</button></form>
    </div>
    <div id="city-rule-body" class="city-rule-body"></div>
    <details class="city-rule-search">
      <summary>检索规则</summary>
      <label class="visually-hidden" for="city-rule-query">规则关键词</label>
      <input id="city-rule-query" type="search" placeholder="例如：命运、鞋印、投票" autocomplete="off">
      <div id="city-search-results" aria-live="polite"></div>
    </details>
    <section class="city-rule-links" aria-label="相关规则"></section>
  </dialog>
  <noscript><p class="city-noscript">请启用 JavaScript 观看实机演示。</p></noscript>
  <script src="js/city-rules.js"></script>
  <script src="js/city.js"></script>
  <script src="js/vendor/hls.light.min.js"></script>
  <script src="js/portfolio-video.js"></script>
  <script src="loading-transition.js"></script>
</body>
</html>
